name = "yammbo-alerts"
main = "src/index.ts"
# account_id is intentionally not committed: this repo is public. deploy.sh
# exports CLOUDFLARE_ACCOUNT_ID at deploy time instead.
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Stream this worker's trace events to the central yammbo-tail Worker. CF
# delivers traces even when an invocation is KILLED (exceededCpu/exceededMemory)
# before the worker's own try/catch can fire — the silent-cron-failure safety net.
tail_consumers = [{ service = "yammbo-tail" }]

[vars]
# Telegram destination (yammbo_alerts_bot). chat_id is not secret.
TELEGRAM_CHAT_ID = "7906560887"

# Secrets (set via: wrangler secret put <NAME>)
# - TELEGRAM_BOT_TOKEN   bot token for @yammbo_alerts_bot
# - ALERT_PATH           shared secret = legacy n8n webhook path

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "yammbo-backups"

# Dead-man switch: 08:00 UTC, ~4.5h after the 03:30 UTC site-backup.timer
# window (plenty of margin for the largest tarballs, e.g. web ~637 MB).
[triggers]
crons = ["0 8 * * *"]

[observability]
enabled = true
